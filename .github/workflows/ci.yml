name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ProjectForge.sln

      - name: Build
        run: dotnet build ProjectForge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ProjectForge.sln --configuration Release --no-build --verbosity normal
